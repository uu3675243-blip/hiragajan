<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ひらがじゃん 公式ルール版</title>
  <meta name="description" content="ひらがなで言葉を作る麻雀風ゲーム（カード版・牌版 完全対応）" />
  <meta property="og:title" content="ひらがじゃん 公式ルール版" />
  <meta property="og:description" content="2〜4人対戦・公式120枚セット・高コントラスト視認性向上版" />
  <meta property="og:type" content="website" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap');
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0d2818; /* 深みのある清潔な雀卓グリーン */
      color: #f8fafc;
    }
    .tile-piece {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #cbd5e1;
      border-bottom: 5px solid #94a3b8;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, border-color 0.1s ease;
    }
    .tile-piece:active, .tile-piece.active-selected {
      transform: translateY(-6px);
      border-color: #f59e0b;
      border-bottom: 5px solid #d97706;
      box-shadow: 0 8px 12px -2px rgba(245, 158, 11, 0.4);
    }
    .slot-box {
      background-color: rgba(15, 23, 42, 0.6);
      border: 2px dashed #94a3b8;
      border-radius: 8px;
    }
    .slot-box.filled {
      border: 2px solid #38bdf8;
      background-color: #ffffff;
      color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Header: 高コントラストで見やすいバー -->
  <header class="bg-slate-900 border-b border-slate-700 px-3 sm:px-4 py-2.5 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🀄</span>
      <h1 class="font-black text-amber-400 text-lg sm:text-xl tracking-wide">ひらがじゃん</h1>
      <span id="headerModeBadge" class="bg-emerald-800 text-emerald-100 font-bold px-2 py-0.5 rounded text-xs border border-emerald-600">カード版</span>
      <span id="roomBadge" class="hidden bg-slate-800 text-amber-300 px-2 py-0.5 rounded border border-slate-600 font-mono text-xs font-bold"></span>
    </div>
    <div class="flex items-center gap-2">
      <span id="userBadge" class="bg-slate-800 border border-slate-600 px-2.5 py-1 rounded text-white font-bold text-xs"></span>
      <button id="btnShare" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-2.5 py-1 rounded text-xs shadow transition">共有</button>
      <button id="btnLeave" class="hidden bg-rose-700 hover:bg-rose-600 text-white font-bold px-2.5 py-1 rounded text-xs shadow transition">退室</button>
    </div>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-2xl text-xs sm:text-sm font-black opacity-0 transition-opacity pointer-events-none duration-300"></div>

  <!-- Main View -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-2 sm:p-4 flex flex-col justify-center">

    <!-- 1. LOBBY SCREEN -->
    <div id="lobbyScreen" class="bg-slate-900/90 border border-slate-700 p-5 sm:p-6 rounded-2xl max-w-md mx-auto w-full shadow-2xl space-y-4">
      <div class="text-center space-y-1">
        <h2 class="text-2xl sm:text-3xl font-black text-amber-400">ひらがじゃん 対局受付</h2>
        <p class="text-xs text-slate-300">公式ルール（全120枚・2〜4人対戦）</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-200 mb-1">あなたのお名前</label>
          <input id="inputName" type="text" maxlength="8" class="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2 text-white font-bold text-sm focus:outline-none focus:border-amber-400" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-200 mb-1.5">ゲームモードを選択</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex flex-col gap-1 bg-slate-950 p-3 rounded-xl border-2 border-slate-700 cursor-pointer hover:border-amber-400 transition has-[:checked]:border-amber-400 has-[:checked]:bg-slate-800">
              <div class="flex items-center gap-1.5">
                <input type="radio" name="gameMode" value="card" checked class="text-amber-500 scale-110" />
                <span class="font-black text-amber-300 text-sm">カード版</span>
              </div>
              <div class="text-[11px] text-slate-300">配札7枚・オープン手札<br>2文字×1 ＋ 3文字×2</div>
            </label>

            <label class="flex flex-col gap-1 bg-slate-950 p-3 rounded-xl border-2 border-slate-700 cursor-pointer hover:border-amber-400 transition has-[:checked]:border-amber-400 has-[:checked]:bg-slate-800">
              <div class="flex items-center gap-1.5">
                <input type="radio" name="gameMode" value="tile" class="text-amber-500 scale-110" />
                <span class="font-black text-amber-300 text-sm">牌版</span>
              </div>
              <div class="text-[11px] text-slate-300">配牌13枚・麻雀形式<br>2文字×1 ＋ 3文字×4<br>ポン・ロン・暗カン</div>
            </label>
          </div>
        </div>

        <div class="pt-2 grid grid-cols-2 gap-2">
          <button id="btnCreateRoom" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-black py-2.5 rounded-xl text-sm shadow-lg transition">
            部屋を作成
          </button>
          <button id="btnToggleJoin" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-sm border border-slate-600 shadow-lg transition">
            部屋に参加
          </button>
        </div>

        <div id="joinBox" class="hidden pt-2 space-y-2">
          <input id="inputRoomId" type="text" placeholder="部屋ID（合言葉）を入力" class="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2 text-white font-bold text-sm uppercase focus:outline-none focus:border-amber-400" />
          <button id="btnJoinRoom" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-xl text-sm shadow-md transition">
            この部屋に入る
          </button>
        </div>
      </div>

      <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-1">
        <div class="font-bold text-amber-400">📜 公式ルール・牌構成（120枚）</div>
        <div>・45音×各2枚 ＋ 濁音半濁音25音×各1枚 ＋ 拗音長音5音×各1枚</div>
        <div>・2人〜4人対戦対応（CPUなし・プレイヤー同士で言葉を審査）</div>
      </div>
    </div>

    <!-- 2. GAME BOARD SCREEN -->
    <div id="gameScreen" class="hidden flex-1 flex flex-col justify-between gap-2.5">
      
      <!-- Top info bar: 鮮明な情報ヘッダー -->
      <div class="bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl flex items-center justify-between text-xs shadow-md">
        <div class="flex items-center gap-3">
          <span id="boardModeTitle" class="font-black text-amber-300 bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800"></span>
          <span class="text-slate-300 font-bold">山札: <span id="deckCount" class="font-black text-amber-400 text-sm">120</span> 枚</span>
        </div>
        <div id="turnBadge" class="font-black px-3 py-1 rounded-lg text-xs shadow-sm">
          待機中
        </div>
      </div>

      <!-- Other Players Hands Area -->
      <div id="otherPlayersArea" class="grid grid-cols-1 sm:grid-cols-3 gap-2"></div>

      <!-- Table Center: Discards (River) & Call Actions -->
      <div class="bg-slate-900/90 rounded-2xl border border-slate-700 p-2.5 sm:p-3 flex-1 flex flex-col justify-between min-h-[160px] shadow-lg">
        
        <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-1.5 text-xs">
          <span class="font-black text-slate-300">捨て場（河）</span>
          <div id="callActionsBox" class="flex items-center gap-2 hidden">
            <span class="text-slate-300 font-bold text-xs">
              直前の捨て牌: <span id="lastDiscardSpan" class="bg-white text-slate-950 font-black px-2 py-0.5 rounded shadow"></span>
            </span>
            <button id="btnPon" class="bg-blue-600 hover:bg-blue-500 text-white font-black px-3 py-1 rounded-lg text-xs shadow transition">ポン！</button>
            <button id="btnRon" class="bg-rose-600 hover:bg-rose-500 text-white font-black px-3 py-1 rounded-lg text-xs shadow transition">ロン！</button>
          </div>
        </div>

        <!-- Discard River Tiles (白牌に黒文字で明瞭) -->
        <div id="discardRiver" class="flex flex-wrap gap-1.5 p-2 bg-slate-950/70 rounded-xl min-h-[64px] max-h-[110px] overflow-y-auto border border-slate-800"></div>

        <!-- Action Log -->
        <div id="gameLog" class="text-xs text-amber-300 font-bold h-5 overflow-hidden text-center truncate pt-1"></div>
      </div>

      <!-- Waiting / Game Start Bar -->
      <div id="waitingControls" class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl">
        <div class="text-xs text-slate-300">
          対局には2〜4人のプレイヤーが必要です（現在 <span id="playerCountSpan" class="font-black text-amber-400 text-sm">1</span> 人）
        </div>
        <button id="btnStartGame" class="w-full sm:w-auto bg-amber-400 hover:bg-amber-300 text-slate-950 font-black px-8 py-2.5 rounded-xl text-sm shadow transition disabled:opacity-40" disabled>
          対局を開始する
        </button>
      </div>

      <!-- Current Player Area: 見やすさを極めたコントラスト -->
      <div class="bg-slate-900 rounded-2xl border-2 border-slate-700 p-3 shadow-2xl space-y-2.5">
        
        <!-- Word Slots Builder (目標の言葉構築トレイ) -->
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <div class="flex items-center justify-between text-xs mb-1.5">
            <span class="font-black text-amber-300" id="goalTitle">完成形を作るスロット</span>
            <button id="btnClearBuilder" class="text-[11px] text-sky-400 hover:text-sky-300 font-bold underline">
              すべて手札に戻す
            </button>
          </div>
          <!-- Slots container -->
          <div id="wordSlotsContainer" class="flex flex-wrap items-center gap-2"></div>
        </div>

        <!-- Unassigned Hand Tiles (選択中の牌) -->
        <div>
          <div class="flex items-center justify-between text-xs px-1 mb-1">
            <span class="text-slate-300 font-bold text-[11px]">手札 / 手牌（牌をタップして選択）</span>
            <div id="meldActions" class="flex items-center gap-1 hidden">
              <button id="btnKan" class="bg-purple-600 hover:bg-purple-500 text-white font-black px-3 py-1 rounded-lg text-xs shadow transition">暗カン</button>
            </div>
          </div>
          <!-- Hand tiles container -->
          <div id="myHandContainer" class="flex items-end justify-center gap-1.5 sm:gap-2 pt-1 pb-1.5 overflow-x-auto min-h-[70px]"></div>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center justify-between pt-2 border-t border-slate-800">
          <div class="text-xs text-amber-300 font-bold truncate max-w-[200px] sm:max-w-xs" id="handGuide">
            待機中
          </div>
          <div class="flex items-center gap-2">
            <button id="btnDiscard" class="bg-slate-700 hover:bg-slate-600 text-white font-black px-4 py-2 rounded-xl text-xs transition border border-slate-500 disabled:opacity-40" disabled>
              捨てる
            </button>
            <button id="btnWin" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-black px-5 py-2 rounded-xl text-xs transition shadow-lg disabled:opacity-40" disabled>
              ひらがじゃん！
            </button>
          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- Win Announcement Modal -->
  <div id="winModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
      <div class="text-5xl animate-bounce">🀄</div>
      <h3 id="winTitle" class="text-3xl font-black text-amber-400">ひらがじゃん！</h3>
      <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
        <div id="winPlayer" class="text-xs text-slate-300 font-bold">勝者</div>
        <div id="winWordsDisplay" class="flex flex-col gap-1.5 text-sm font-black text-white"></div>
      </div>
      <button id="btnNextRound" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-black py-2.5 rounded-xl text-sm shadow transition">
        次の局を準備する
      </button>
    </div>
  </div>

  <script>
    // 1. Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDTH8N9_9QAj_Id9KNnvVfN62v42zg-Rtk",
      authDomain: "hiragajan-af30f.firebaseapp.com",
      databaseURL: "https://hiragajan-af30f-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hiragajan-af30f",
      storageBucket: "hiragajan-af30f.firebasestorage.app",
      messagingSenderId: "209578576362",
      appId: "1:209578576362:web:1875a3f7ce9ff21c93ca93"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_ROOT = 'rooms_br';

    // 2. 公式120枚セット
    const SEION_45 = [
      'あ','い','う','え','お', 'か','き','く','け','こ',
      'さ','し','す','せ','そ', 'た','ち','つ','て','と',
      'な','に','ぬ','ね','の', 'は','ひ','ふ','へ','ほ',
      'ま','み','む','め','も', 'や','ゆ','よ',
      'ら','り','る','れ','ろ', 'わ','ん'
    ];
    const DAKUON_25 = [
      'が','ぎ','ぐ','げ','ご',
      'ざ','じ','ず','ぜ','ぞ',
      'だ','ぢ','づ','で','ど',
      'ば','び','ぶ','べ','ぼ',
      'ぱ','ぴ','ぷ','ぺ','ぽ'
    ];
    const YOUON_5 = ['ゃ','ゅ','ょ','っ','ー'];

    // 120枚カード/牌（各牌に一意のIDを付与して重複文字のバグを完全解消）
    function createOfficial120Deck() {
      const deck = [];
      let seq = 1;
      // 45音 × 2枚
      SEION_45.forEach(char => {
        deck.push({ id: `t_${seq++}`, char });
        deck.push({ id: `t_${seq++}`, char });
      });
      // 濁音・半濁音 25音 × 1枚
      DAKUON_25.forEach(char => deck.push({ id: `t_${seq++}`, char }));
      // 拗音・長音 5音 × 1枚
      YOUON_5.forEach(char => deck.push({ id: `t_${seq++}`, char }));

      // シャッフル
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    // 3. Local State
    let myToken = localStorage.getItem('hiraga_token') || 'u_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('hiraga_token', myToken);
    let myName = localStorage.getItem('hiraga_name') || '雀士' + Math.floor(Math.random() * 900 + 100);
    let currentRoomId = null;
    let roomRef = null;
    let localRoom = null;
    let selectedTileId = null; // 牌IDで選択管理

    // Word builder slots: 各スロットに牌オブジェクトの配列を保持
    let wordSlots = [];

    // DOM Elements
    const lobbyScreen = document.getElementById('lobbyScreen');
    const gameScreen = document.getElementById('gameScreen');
    const inputName = document.getElementById('inputName');
    const btnCreateRoom = document.getElementById('btnCreateRoom');
    const btnToggleJoin = document.getElementById('btnToggleJoin');
    const joinBox = document.getElementById('joinBox');
    const inputRoomId = document.getElementById('inputRoomId');
    const btnJoinRoom = document.getElementById('btnJoinRoom');
    const headerModeBadge = document.getElementById('headerModeBadge');
    const roomBadge = document.getElementById('roomBadge');
    const userBadge = document.getElementById('userBadge');
    const btnShare = document.getElementById('btnShare');
    const btnLeave = document.getElementById('btnLeave');
    const toast = document.getElementById('toast');
    const boardModeTitle = document.getElementById('boardModeTitle');
    const deckCount = document.getElementById('deckCount');
    const turnBadge = document.getElementById('turnBadge');
    const otherPlayersArea = document.getElementById('otherPlayersArea');
    const discardRiver = document.getElementById('discardRiver');
    const lastDiscardSpan = document.getElementById('lastDiscardSpan');
    const callActionsBox = document.getElementById('callActionsBox');
    const btnPon = document.getElementById('btnPon');
    const btnRon = document.getElementById('btnRon');
    const gameLog = document.getElementById('gameLog');
    const waitingControls = document.getElementById('waitingControls');
    const playerCountSpan = document.getElementById('playerCountSpan');
    const btnStartGame = document.getElementById('btnStartGame');
    const goalTitle = document.getElementById('goalTitle');
    const btnClearBuilder = document.getElementById('btnClearBuilder');
    const wordSlotsContainer = document.getElementById('wordSlotsContainer');
    const myHandContainer = document.getElementById('myHandContainer');
    const handGuide = document.getElementById('handGuide');
    const btnDiscard = document.getElementById('btnDiscard');
    const btnWin = document.getElementById('btnWin');
    const meldActions = document.getElementById('meldActions');
    const btnKan = document.getElementById('btnKan');
    const winModal = document.getElementById('winModal');
    const winTitle = document.getElementById('winTitle');
    const winPlayer = document.getElementById('winPlayer');
    const winWordsDisplay = document.getElementById('winWordsDisplay');
    const btnNextRound = document.getElementById('btnNextRound');

    inputName.value = myName;
    userBadge.textContent = myName;
    inputName.addEventListener('change', () => {
      myName = inputName.value.trim() || '名無し';
      localStorage.setItem('hiraga_name', myName);
      userBadge.textContent = myName;
    });

    btnToggleJoin.addEventListener('click', () => {
      joinBox.classList.toggle('hidden');
    });

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = `fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-2xl text-xs sm:text-sm font-black transition-opacity duration-300 ${
        isError ? 'bg-rose-600 text-white border border-rose-400' : 'bg-amber-400 text-slate-950 border border-amber-300'
      } opacity-100`;
      setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 3000);
    }

    // 4. Room Management
    btnCreateRoom.addEventListener('click', () => {
      const mode = document.querySelector('input[name="gameMode"]:checked').value;
      const roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
      const initialDeck = createOfficial120Deck();

      const initialRoom = {
        roomId,
        mode,
        hostToken: myToken,
        status: 'waiting',
        deck: initialDeck,
        discardRiver: [],
        lastDiscard: null,
        order: [myToken],
        turnIndex: 0,
        players: {
          [myToken]: {
            token: myToken,
            name: myName,
            hand: [],
            melds: []
          }
        },
        log: `${myName} が部屋を作成しました（${mode === 'card' ? 'カード版' : '牌版'}）`
      };

      db.ref(`${DB_ROOT}/${roomId}`).set(initialRoom).then(() => {
        connectRoom(roomId);
        showToast(`部屋 ${roomId} を作成しました`);
      }).catch(err => showToast(err.message, true));
    });

    btnJoinRoom.addEventListener('click', () => {
      const rid = inputRoomId.value.trim().toUpperCase();
      if (!rid) return showToast('部屋IDを入力してください', true);
      joinRoom(rid);
    });

    function joinRoom(roomId) {
      const ref = db.ref(`${DB_ROOT}/${roomId}`);
      ref.transaction(room => {
        if (!room) return room;
        if (!room.players) room.players = {};
        if (!room.order) room.order = [];

        if (!room.players[myToken]) {
          if (room.order.length >= 4) return;
          if (room.status !== 'waiting') return;
          room.players[myToken] = {
            token: myToken,
            name: myName,
            hand: [],
            melds: []
          };
          room.order.push(myToken);
          room.log = `${myName} が参加しました`;
        }
        return room;
      }, (err, committed) => {
        if (err || !committed) {
          showToast('部屋に参加できません（満員・対局中・存在しないID）', true);
        } else {
          connectRoom(roomId);
        }
      });
    }

    function connectRoom(roomId) {
      if (roomRef) roomRef.off();
      currentRoomId = roomId;
      roomRef = db.ref(`${DB_ROOT}/${roomId}`);

      roomRef.on('value', snapshot => {
        localRoom = snapshot.val();
        if (!localRoom) {
          showToast('部屋が解散されました', true);
          exitToLobby();
          return;
        }
        render(localRoom);
      }, err => showToast('接続エラー: ' + err.message, true));

      const url = new URL(window.location);
      url.searchParams.set('room', roomId);
      window.history.replaceState({}, '', url);

      lobbyScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      roomBadge.classList.remove('hidden');
      roomBadge.textContent = '部屋: ' + roomId;
      btnShare.classList.remove('hidden');
      btnLeave.classList.remove('hidden');
    }

    function exitToLobby() {
      if (roomRef) roomRef.off();
      currentRoomId = null;
      localRoom = null;
      const url = new URL(window.location);
      url.searchParams.delete('room');
      window.history.replaceState({}, '', url);

      lobbyScreen.classList.remove('hidden');
      gameScreen.classList.add('hidden');
      roomBadge.classList.add('hidden');
      btnShare.classList.add('hidden');
      btnLeave.classList.add('hidden');
      winModal.classList.add('hidden');
    }

    btnLeave.addEventListener('click', () => {
      if (confirm('退室しますか？')) exitToLobby();
    });

    btnShare.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('招待URLをコピーしました！友達に共有してください');
      }).catch(() => showToast('部屋ID: ' + currentRoomId));
    });

    // 5. Game Start (公式ルール: カード版7枚、牌版13枚)
    btnStartGame.addEventListener('click', () => {
      if (!roomRef) return;
      roomRef.transaction(room => {
        if (!room || (room.order && room.order.length < 2)) return room;
        const deck = createOfficial120Deck();
        const mode = room.mode;
        const handCount = (mode === 'card') ? 7 : 13;

        room.order.forEach(tok => {
          room.players[tok].hand = deck.splice(0, handCount);
          room.players[tok].melds = [];
        });

        room.deck = deck;
        room.status = 'playing';
        room.turnIndex = 0;
        room.discardRiver = [];
        room.lastDiscard = null;

        // 最初の人が山から1枚引く
        const firstPlayer = room.players[room.order[0]];
        if (room.deck.length > 0) {
          firstPlayer.hand.push(room.deck.shift());
        }

        room.log = `対局開始！${firstPlayer.name} の手番です`;
        return room;
      });
    });

    // 6. 捨てる（Discard）
    btnDiscard.addEventListener('click', () => {
      if (!selectedTileId || !roomRef) return;
      const targetId = selectedTileId;
      selectedTileId = null;

      // スロットにその牌が入っていればスロットからも取り除く
      wordSlots.forEach(slot => {
        const idx = slot.findIndex(t => t.id === targetId);
        if (idx !== -1) slot.splice(idx, 1);
      });

      roomRef.transaction(room => {
        if (!room || room.status !== 'playing') return room;
        const currentToken = room.order[room.turnIndex];
        if (currentToken !== myToken) return room;

        const player = room.players[myToken];
        if (!player || !player.hand) return room;

        const tIdx = player.hand.findIndex(t => t.id === targetId);
        if (tIdx === -1) return room;

        const discarded = player.hand.splice(tIdx, 1)[0];
        if (!room.discardRiver) room.discardRiver = [];
        room.discardRiver.push({
          id: discarded.id,
          char: discarded.char,
          player: player.name,
          token: myToken
        });
        room.lastDiscard = {
          id: discarded.id,
          char: discarded.char,
          fromToken: myToken,
          fromName: player.name
        };

        room.log = `${player.name} が「${discarded.char}」を捨てました`;

        // 手番送り
        room.turnIndex = (room.turnIndex + 1) % room.order.length;
        const nextToken = room.order[room.turnIndex];
        const nextPlayer = room.players[nextToken];

        if (!room.deck || room.deck.length === 0) {
          room.status = 'round_end';
          room.winner = null;
          room.log = '流局（山札がなくなりました）';
          return room;
        }

        // 次のプレイヤーが山から1枚引く
        nextPlayer.hand.push(room.deck.shift());
        return room;
      });
    });

    // 7. ポン (Pon)
    btnPon.addEventListener('click', () => {
      if (!roomRef || !localRoom || !localRoom.lastDiscard) return;
      const last = localRoom.lastDiscard;
      const p = localRoom.players[myToken];
      if (!p || !p.hand || p.hand.length < 2) return;

      const promptRes = prompt(`「${last.char}」をもらってポン！\n一緒に3文字の言葉を作る手持ちの2文字を入力してください（例: ねこ）:`);
      if (!promptRes) return;
      const chars = promptRes.trim().split('');
      if (chars.length !== 2) return alert('手札から2文字選んでください');

      // 手札内にその文字が存在するかIDベースで探索
      const available = [...p.hand];
      const selectedTiles = [];
      for (const ch of chars) {
        const idx = available.findIndex(t => t.char === ch);
        if (idx === -1) return alert(`手札に「${ch}」がありません`);
        selectedTiles.push(available.splice(idx, 1)[0]);
      }

      roomRef.transaction(room => {
        if (!room || room.status !== 'playing' || !room.lastDiscard) return room;
        const targetLast = room.lastDiscard;
        const player = room.players[myToken];

        // 手札から2枚取り除く
        selectedTiles.forEach(t => {
          const idx = player.hand.findIndex(h => h.id === t.id);
          if (idx !== -1) player.hand.splice(idx, 1);
        });

        if (!player.melds) player.melds = [];
        const completedWord = `${chars[0]}${chars[1]}${targetLast.char}`;
        player.melds.push(completedWord);

        if (room.discardRiver && room.discardRiver.length > 0) {
          room.discardRiver.pop();
        }
        room.lastDiscard = null;

        // ポンした人が続けて1枚捨てるため、手番をポンした人にセット
        room.turnIndex = room.order.indexOf(myToken);
        room.log = `${player.name} が「ポン！」と宣言し、「${completedWord}」を作りました`;
        return room;
      });
    });

    // 8. 暗カン (Kan)
    btnKan.addEventListener('click', () => {
      if (!roomRef || !localRoom) return;
      const p = localRoom.players[myToken];
      if (!p || !p.hand) return;

      const counts = {};
      p.hand.forEach(t => counts[t.char] = (counts[t.char] || 0) + 1);
      const kanChar = Object.keys(counts).find(c => counts[c] >= 4);
      if (!kanChar) {
        showToast('同じ牌が4枚そろっていません', true);
        return;
      }

      roomRef.transaction(room => {
        if (!room || room.status !== 'playing') return room;
        const player = room.players[myToken];
        let removed = 0;
        player.hand = player.hand.filter(t => {
          if (t.char === kanChar && removed < 4) {
            removed++;
            return false;
          }
          return true;
        });

        if (!player.melds) player.melds = [];
        player.melds.push(`[カン:${kanChar}×4]`);

        // カン補充
        if (room.deck && room.deck.length > 0) {
          player.hand.push(room.deck.shift());
        }

        room.log = `${player.name} が「カン！」（暗カン: ${kanChar}4枚）を宣言しました`;
        return room;
      });
    });

    // 9. ロン (Ron)
    btnRon.addEventListener('click', () => {
      if (!roomRef || !localRoom || !localRoom.lastDiscard) return;
      declareWin('ロン', localRoom.lastDiscard);
    });

    // 10. ツモ / ひらがじゃん！
    btnWin.addEventListener('click', () => {
      declareWin('ツモ');
    });

    function declareWin(type, ronTile = null) {
      if (!localRoom || !roomRef) return;
      const mode = localRoom.mode;
      const req = (mode === 'card') ? [2, 3, 3] : [2, 3, 3, 3, 3];
      const p = localRoom.players[myToken];
      const melds = p.melds || [];

      // スロット内の言葉
      const wordsFromSlots = wordSlots.map(s => s.map(t => t.char).join('')).filter(w => w.length > 0);
      const totalWords = [...wordsFromSlots, ...melds];

      // ロン牌の組み込みチェック
      if (ronTile) {
        const flatChars = wordSlots.flat().map(t => t.char);
        if (!flatChars.includes(ronTile.char)) {
          showToast(`直前の捨て牌「${ronTile.char}」をスロットの言葉に組み込んでください`, true);
          return;
        }
      }

      const lengths = totalWords.map(w => w.startsWith('[カン') ? 3 : w.length).sort((a,b) => a - b);
      const targetLengths = [...req].sort((a,b) => a - b);

      if (lengths.length !== targetLengths.length || !lengths.every((l, i) => l === targetLengths[i])) {
        showToast(
          mode === 'card'
            ? '単語は「2文字×1組」「3文字×2組」（計8文字）で完成させてください'
            : '言葉は「2文字×1組」「3文字×4組」（計14文字）で完成させてください',
          true
        );
        return;
      }

      roomRef.transaction(room => {
        if (!room || room.status !== 'playing') return room;
        const winner = room.players[myToken];
        room.status = 'round_end';
        room.winner = {
          token: myToken,
          name: winner.name,
          type: type,
          words: totalWords
        };
        room.log = `${winner.name} が「ひらがじゃん！」と宣言して勝利しました！（${type}）`;
        return room;
      });
    }

    // 次の局へ進む
    btnNextRound.addEventListener('click', () => {
      winModal.classList.add('hidden');
      if (!roomRef) return;
      roomRef.transaction(room => {
        if (!room) return room;
        room.status = 'waiting';
        room.winner = null;
        room.deck = createOfficial120Deck();
        room.discardRiver = [];
        room.lastDiscard = null;
        room.order.forEach(tok => {
          room.players[tok].hand = [];
          room.players[tok].melds = [];
        });
        room.log = '局が終了しました。次の対局を開始できます';
        return room;
      });
    });

    // 11. Word Slot Helpers
    function initWordSlots(mode) {
      const counts = (mode === 'card') ? [2, 3, 3] : [2, 3, 3, 3, 3];
      if (wordSlots.length !== counts.length) {
        wordSlots = counts.map(() => []);
      }
    }

    btnClearBuilder.addEventListener('click', () => {
      if (!localRoom) return;
      initWordSlots(localRoom.mode);
      render(localRoom);
    });

    // 12. Main Render
    function render(room) {
      const mode = room.mode || 'card';
      initWordSlots(mode);

      const isHost = room.hostToken === myToken;
      const currentToken = room.order ? room.order[room.turnIndex] : null;
      const isMyTurn = currentToken === myToken && room.status === 'playing';

      headerModeBadge.textContent = mode === 'card' ? 'カード版' : '牌版';
      boardModeTitle.textContent = mode === 'card' ? 'カード版（全員手札オープン）' : '牌版（麻雀ルール）';
      goalTitle.textContent = mode === 'card' ? '完成形: 2文字×1組 ＋ 3文字×2組（計3語）' : '完成形: 2文字×1組 ＋ 3文字×4組（計5語）';
      deckCount.textContent = room.deck ? room.deck.length : 0;
      gameLog.textContent = room.log || '';

      // Waiting Controls
      if (room.status === 'waiting') {
        waitingControls.classList.remove('hidden');
        playerCountSpan.textContent = room.order ? room.order.length : 1;
        btnStartGame.disabled = !isHost || (room.order && room.order.length < 2);
        turnBadge.textContent = '対局準備中';
        turnBadge.className = 'font-black px-3 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs border border-slate-700';
      } else {
        waitingControls.classList.add('hidden');
        if (isMyTurn) {
          turnBadge.textContent = 'あなたの手番です！';
          turnBadge.className = 'font-black px-3 py-1 rounded-lg bg-amber-400 text-slate-950 text-xs shadow-md animate-pulse';
        } else {
          const curP = room.players[currentToken];
          turnBadge.textContent = `${curP ? curP.name : '相手'} の手番`;
          turnBadge.className = 'font-black px-3 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs border border-slate-700';
        }
      }

      // Other Players Area
      otherPlayersArea.innerHTML = '';
      if (room.order) {
        room.order.forEach(tok => {
          if (tok === myToken) return;
          const p = room.players[tok];
          if (!p) return;
          const isTurn = currentToken === tok && room.status === 'playing';

          const cardBox = document.createElement('div');
          cardBox.className = `p-2.5 rounded-xl border ${
            isTurn ? 'border-amber-400 bg-slate-800 ring-2 ring-amber-400/40' : 'border-slate-800 bg-slate-900/80'
          } flex flex-col justify-between shadow`;

          let cardsHtml = '';
          const hand = p.hand || [];

          if (mode === 'card') {
            // カード版公式ルール: 「全員から見えるように手元にオープンで置く」
            hand.forEach(t => {
              cardsHtml += `<div class="w-6 h-8 bg-white rounded border border-slate-300 text-slate-950 font-black text-xs flex items-center justify-center shadow-sm">${t.char}</div>`;
            });
          } else {
            // 牌版公式ルール: 手牌は伏せ牌
            hand.forEach(() => {
              cardsHtml += `<div class="w-5 h-7 bg-slate-700 rounded border border-slate-500 text-[10px] text-amber-300 font-bold flex items-center justify-center shadow-sm">🀄</div>`;
            });
          }

          let meldsHtml = '';
          if (p.melds && p.melds.length > 0) {
            meldsHtml = `<div class="text-[11px] text-emerald-400 font-bold mt-1.5">鳴き: ${p.melds.join(' / ')}</div>`;
          }

          cardBox.innerHTML = `
            <div class="flex items-center justify-between text-xs mb-1.5">
              <span class="font-black text-white">${p.name}</span>
              <span class="text-xs text-amber-400 font-mono font-bold">${hand.length} 枚</span>
            </div>
            <div class="flex flex-wrap gap-1">${cardsHtml}</div>
            ${meldsHtml}
          `;
          otherPlayersArea.appendChild(cardBox);
        });
      }

      // Discard River (河)
      discardRiver.innerHTML = '';
      if (room.discardRiver && room.discardRiver.length > 0) {
        room.discardRiver.forEach(d => {
          const t = document.createElement('div');
          t.className = 'w-7 sm:w-8 h-9 sm:h-10 bg-white rounded border border-slate-300 text-slate-950 font-black text-base flex items-center justify-center shadow-sm';
          t.textContent = d.char;
          t.title = `${d.player} の捨て牌`;
          discardRiver.appendChild(t);
        });
      } else {
        discardRiver.innerHTML = '<span class="text-xs text-slate-500 m-auto font-bold">捨て牌がありません</span>';
      }

      // Call Actions (ポン / ロン)
      if (mode === 'tile' && room.lastDiscard && room.lastDiscard.fromToken !== myToken && room.status === 'playing') {
        callActionsBox.classList.remove('hidden');
        lastDiscardSpan.textContent = room.lastDiscard.char;
      } else {
        callActionsBox.classList.add('hidden');
      }

      // My Hand & Word Slots
      const myData = room.players[myToken] || { hand: [], melds: [] };
      const myHand = myData.hand || [];

      // Dark Kan possibility
      if (mode === 'tile' && isMyTurn) {
        const counts = {};
        myHand.forEach(t => counts[t.char] = (counts[t.char] || 0) + 1);
        const canKan = Object.values(counts).some(cnt => cnt >= 4);
        meldActions.classList.toggle('hidden', !canKan);
      } else {
        meldActions.classList.add('hidden');
      }

      // Render Word Slots
      wordSlotsContainer.innerHTML = '';
      const slotLengths = (mode === 'card') ? [2, 3, 3] : [2, 3, 3, 3, 3];
      
      slotLengths.forEach((len, slotIdx) => {
        const slotEl = document.createElement('div');
        slotEl.className = 'flex items-center gap-1.5 bg-slate-900 p-2 rounded-xl border border-slate-700';

        const label = document.createElement('span');
        label.className = 'text-[11px] text-amber-300 font-black mr-0.5';
        label.textContent = `${len}文字:`;
        slotEl.appendChild(label);

        const currentSlotTiles = wordSlots[slotIdx] || [];
        for (let i = 0; i < len; i++) {
          const tile = currentSlotTiles[i];
          const slotBox = document.createElement('div');
          
          if (tile) {
            slotBox.className = 'slot-box filled w-8 sm:w-9 h-10 sm:h-11 flex items-center justify-center text-lg sm:text-xl font-black cursor-pointer shadow-md';
            slotBox.textContent = tile.char;
            slotBox.title = 'タップで手札に戻す';
            slotBox.addEventListener('click', () => {
              currentSlotTiles.splice(i, 1);
              render(localRoom);
            });
          } else {
            slotBox.className = 'slot-box w-8 sm:w-9 h-10 sm:h-11 flex items-center justify-center text-sm font-bold text-slate-500 cursor-pointer hover:border-amber-400 hover:text-amber-400 transition';
            slotBox.textContent = '＋';
            slotBox.title = '手札の牌を選んでここをタップ';
            slotBox.addEventListener('click', () => {
              if (selectedTileId) {
                const found = myHand.find(t => t.id === selectedTileId);
                if (found) {
                  // 他のスロットに入っていれば取り除く
                  wordSlots.forEach(s => {
                    const idx = s.findIndex(t => t.id === selectedTileId);
                    if (idx !== -1) s.splice(idx, 1);
                  });
                  currentSlotTiles.push(found);
                  selectedTileId = null;
                  render(localRoom);
                }
              }
            });
          }
          slotEl.appendChild(slotBox);
        }
        wordSlotsContainer.appendChild(slotEl);
      });

      // Render My Hand Tiles（スロット未割り当ての牌のみ）
      myHandContainer.innerHTML = '';
      const assignedIds = new Set(wordSlots.flat().map(t => t.id));
      const unassignedHand = myHand.filter(t => !assignedIds.has(t.id));

      unassignedHand.forEach(tile => {
        const btn = document.createElement('button');
        const isSelected = selectedTileId === tile.id;

        btn.className = `tile-piece w-10 sm:w-12 h-14 sm:h-16 flex items-center justify-center text-2xl sm:text-3xl font-black cursor-pointer ${
          isSelected ? 'active-selected ring-4 ring-amber-400' : ''
        }`;
        btn.textContent = tile.char;
        btn.addEventListener('click', () => {
          selectedTileId = isSelected ? null : tile.id;
          render(localRoom);
        });
        myHandContainer.appendChild(btn);
      });

      // Controls State
      btnDiscard.disabled = !isMyTurn || !selectedTileId;
      btnWin.disabled = !isMyTurn;

      if (isMyTurn) {
        handGuide.textContent = selectedTileId
          ? '牌を選択中: 「捨てる」か、上のスロットの「＋」をタップして配置'
          : '牌をタップして選択してください';
      } else {
        handGuide.textContent = '手番待機中';
      }

      // Win Modal Display
      if (room.status === 'round_end' && room.winner) {
        winModal.classList.remove('hidden');
        winTitle.textContent = 'ひらがじゃん！';
        winPlayer.textContent = `${room.winner.name} の勝利！（${room.winner.type}）`;
        winWordsDisplay.innerHTML = '';
        (room.winner.words || []).forEach(w => {
          const item = document.createElement('div');
          item.className = 'bg-slate-900 border border-amber-400/60 px-3 py-1.5 rounded-lg text-amber-300 text-center font-black tracking-widest text-base';
          item.textContent = `【 ${w} 】`;
          winWordsDisplay.appendChild(item);
        });
        btnNextRound.classList.toggle('hidden', !isHost);
      } else if (room.status === 'round_end' && !room.winner) {
        winModal.classList.remove('hidden');
        winTitle.textContent = '流局';
        winPlayer.textContent = '山札120枚が尽きました';
        winWordsDisplay.innerHTML = '<div class="text-sm text-slate-400 font-bold">引き分け</div>';
        btnNextRound.classList.toggle('hidden', !isHost);
      } else {
        winModal.classList.add('hidden');
      }
    }

    // Auto join from URL query ?room=XXXX
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get('room');
      if (urlRoom) {
        inputRoomId.value = urlRoom;
        joinRoom(urlRoom);
      }
    });
  </script>
</body>
</html>
