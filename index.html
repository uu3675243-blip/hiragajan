<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>ひらがじゃん</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --panel:rgba(255,255,255,.08); --line:rgba(255,255,255,.12);
  --text:#e5eefc; --muted:#a9bbd6; --card:#f8fafc; --cardText:#0f172a; --acc:#f59e0b; --acc2:#fbbf24;
  --ok:#10b981; --danger:#ef4444; --violet:#8b5cf6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer;border:none;border-radius:12px;padding:10px 14px;font-weight:800}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);padding:10px 12px}
textarea{width:100%;min-height:72px;resize:vertical}
.shell{max-width:1240px;margin:0 auto;padding:12px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;border:1px solid var(--line);background:var(--panel);border-radius:18px}
.top h1{margin:0 auto 0 0;font-size:24px;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.p{background:linear-gradient(90deg,var(--acc2),var(--acc));color:#4a2b05}.s{background:#334155;color:#fff}.g{background:var(--ok);color:#fff}.r{background:var(--danger);color:#fff}.v{background:var(--violet);color:#fff}
.grid{display:grid;grid-template-columns:360px 1fr;gap:12px;margin-top:12px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12px;font-weight:700}
.msg{padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,#fff8dc,#fde68a);color:#6b3f00;font-weight:800}
.players{display:grid;gap:8px}.pl{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.pl.act{outline:2px solid rgba(251,191,36,.8)}.nm{font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.tableArea{display:grid;gap:10px}
.discards{display:flex;flex-wrap:wrap;gap:6px;min-height:52px}
.dTile,.tile{width:54px;height:68px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;background:var(--card);color:var(--cardText);box-shadow:0 8px 18px rgba(0,0,0,.18);border:2px solid transparent}
.tile .k{font-size:26px;font-weight:900;line-height:1}.tile .m{font-size:9px;color:#64748b;margin-top:4px}
.tile.sel{border-color:var(--acc);transform:translateY(-4px)}
.tile.hidden{background:linear-gradient(145deg,#475569,#1f2937);color:#fff}
.tile.small{width:46px;height:58px}.openWord{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.openWord .wl{font-size:12px;color:var(--muted);font-weight:700;min-width:72px}
.handWrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:flex-end}
.handInfo{font-size:12px;color:var(--muted)}
.actions{display:grid;gap:8px}
.rule{font-size:13px;line-height:1.75;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:4px 0}
.logs{display:grid;gap:8px;max-height:280px;overflow:auto}.log{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.lt{font-size:12px}.ls{font-size:10px;color:var(--muted);margin-top:4px}
.badge{padding:4px 8px;border-radius:999px;background:rgba(251,191,36,.14);color:#fde68a;font-size:11px;font-weight:800}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:18px;height:18px}
.note{font-size:12px;color:#fde68a}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <h1>🀄 ひらがじゃん</h1>
    <input id="playerName" placeholder="名前" maxlength="20">
    <select id="modeSel">
      <option value="card">カード版</option>
      <option value="tile">牌版</option>
    </select>
    <select id="maxPlayers">
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4" selected>4人</option>
    </select>
    <label class="chk"><input type="checkbox" id="sevenPairs"> 七対子あり</label>
    <input id="roomInput" placeholder="部屋ID" maxlength="12">
    <button class="p" id="createBtn">部屋作成</button>
    <button class="s" id="joinBtn">参加</button>
    <button class="s" id="copyBtn">コピー</button>
    <button class="g" id="startBtn">開始</button>
    <button class="r" id="resetBtn">初期化</button>
  </div>

  <div class="grid">
    <aside class="panel sec">
      <div class="meta" id="meta"></div>
      <div class="msg" id="message">部屋を作成するか参加してください。</div>
      <div class="players" id="players"></div>
      <div class="hr"></div>
      <div><strong>進行</strong></div>
      <div class="actions" id="actions"></div>
      <div class="note">単語の意味・妥当性はプレイヤー同士で確認してください。アプリは主に配牌・山札・捨て牌・手番進行を管理します。</div>
      <div class="hr"></div>
      <div><strong>ルール要点</strong></div>
      <div class="rule" id="rulesText"></div>
    </aside>

    <main class="sec">
      <section class="panel sec">
        <div class="row" style="justify-content:space-between"><strong>捨て牌</strong><span class="badge" id="pendingBadge">なし</span></div>
        <div class="discards" id="discards"></div>
      </section>

      <section class="panel sec">
        <strong>公開メルド / 確定語</strong>
        <div id="openWords"></div>
      </section>

      <section class="panel sec">
        <strong>あなたの手札</strong>
        <div class="handInfo" id="handInfo">-</div>
        <div class="handWrap" id="hand"></div>
      </section>

      <section class="panel sec">
        <div class="row" style="justify-content:space-between"><strong>行動ログ</strong><span class="badge" id="statusBadge">待機中</span></div>
        <div class="logs" id="logs"></div>
      </section>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* Firebase config */
var firebaseConfig={
  apiKey:"AIzaSyDTH8N9_9QAj_Id9KNnvVfN62v42zg-Rtk",
  authDomain:"hiragajan-af30f.firebaseapp.com",
  databaseURL:"https://hiragajan-af30f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"hiragajan-af30f",
  storageBucket:"hiragajan-af30f.firebasestorage.app",

  appId:"1:209578576362:web:1875a3f7ce9ff21c93ca93"
};
var ROOM_PATH='rooms_br';
firebase.initializeApp(firebaseConfig);
var db=firebase.database();

/* Character set: 120 tiles */
var BASE=['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','ん'];
var DAKU=['が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ','だ','ぢ','づ','で','ど','ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ'];
var SMALL=['ゃ','ゅ','ょ','っ','ー'];
var META={};
BASE.forEach(function(k){META[k]={kind:'基本',count:2};}); DAKU.forEach(function(k){META[k]={kind:'濁/半濁',count:1};}); SMALL.forEach(function(k){META[k]={kind:'拗音/長音',count:1};});

var E={}; ['playerName','modeSel','maxPlayers','sevenPairs','roomInput','createBtn','joinBtn','copyBtn','startBtn','resetBtn','meta','message','players','actions','rulesText','discards','pendingBadge','openWords','handInfo','hand','logs','statusBadge'].forEach(function(id){E[id]=document.getElementById(id);});
var LS={token:'hgj_tk',room:'hgj_room',name:'hgj_name'};
var S={token:loadToken(),roomId:localStorage.getItem(LS.room)||'',playerName:localStorage.getItem(LS.name)||'',room:null,unsub:null,selected:[],shownWinner:'',manualWords:''};

function loadToken(){var t=localStorage.getItem(LS.token); if(!t){t='hgj_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(LS.token,t);} return t;}
function roomRef(id){return db.ref(ROOM_PATH+'/'+id);} 
function toast(msg){alert(msg);} /* simple & robust */
function nowIso(){return new Date().toISOString();}
function sortChars(arr){return arr.slice().sort(function(a,b){return a.ch.localeCompare(b.ch,'ja');});}
function makeDeck(){var d=[]; BASE.forEach(function(ch){for(var i=0;i<2;i++)d.push({id:ch+'_'+i+'_'+Math.random().toString(36).slice(2,7),ch:ch});}); DAKU.forEach(function(ch){d.push({id:ch+'_0_'+Math.random().toString(36).slice(2,7),ch:ch});}); SMALL.forEach(function(ch){d.push({id:ch+'_0_'+Math.random().toString(36).slice(2,7),ch:ch});}); return shuffle(d);}
function shuffle(a){var r=a.slice(); for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t;} return r;}
function multiset(chars){var m={}; chars.forEach(function(c){m[c]=(m[c]||0)+1;}); return m;}
function sameMultiset(a,b){var ma=multiset(a),mb=multiset(b),ka=Object.keys(ma),kb=Object.keys(mb); if(ka.length!==kb.length)return false; for(var i=0;i<ka.length;i++){var k=ka[i]; if(ma[k]!==mb[k])return false;} return true;}
function parseWords(input){return String(input||'').trim().split(/\s+/).filter(Boolean);}
function sumLens(ws){return ws.reduce(function(n,w){return n+Array.from(w).length;},0);}
function lens(ws){return ws.map(function(w){return Array.from(w).length;}).sort(function(a,b){return a-b;});}
function mySeat(){if(!S.room)return -1; var ps=S.room.players||[]; for(var i=0;i<ps.length;i++) if(ps[i].token===S.token) return ps[i].seat; return -1;}
function myPlayer(){var s=mySeat(); return s<0?null:(S.room.players||[]).find(function(p){return p.seat===s;})||null;}
function handOf(seat){var h=S.room&&S.room.hands&&S.room.hands[String(seat)]; return h?sortChars(h):[];}
function openOf(seat){return (S.room&&S.room.openWords&&S.room.openWords[String(seat)])||[];}
function discardsOf(seat){return (S.room&&S.room.discardBySeat&&S.room.discardBySeat[String(seat)])||[];}
function nextSeat(seat){var n=(S.room.players||[]).length; return n?((seat+1)%n):0;}
function log(st,text){st.logs=st.logs||[]; st.logs.push({at:nowIso(),text:text}); if(st.logs.length>120) st.logs=st.logs.slice(-120);}
function saveName(){S.playerName=(E.playerName.value||'').trim().slice(0,20); localStorage.setItem(LS.name,S.playerName);}

function createRoom(){saveName(); var roomId=Math.random().toString(36).slice(2,8).toUpperCase(); var mode=E.modeSel.value; var maxPlayers=Number(E.maxPlayers.value||4); var st={roomId:roomId,mode:mode,maxPlayers:maxPlayers,options:{sevenPairs:!!E.sevenPairs.checked},status:'waiting',turnSeat:0,phase:'draw',pendingDiscard:null,players:[{seat:0,token:S.token,name:S.playerName||'ホスト',score:0,lockedRon:false}],hands:{'0':[]},openWords:{'0':[]},discardBySeat:{'0':[]},discards:[],deck:[],winner:null,logs:[]}; log(st,(S.playerName||'ホスト')+' が部屋を作成'); roomRef(roomId).set(st).then(function(){S.roomId=roomId; localStorage.setItem(LS.room,roomId); subscribe(roomId); E.roomInput.value=roomId; history.replaceState({},'',location.pathname+'?room='+roomId);}).catch(function(e){toast('作成失敗: '+e.message);});}
function joinRoom(){saveName(); var roomId=(E.roomInput.value||'').trim().toUpperCase(); if(!roomId) return toast('部屋IDを入力してください'); roomRef(roomId).transaction(function(st){ if(!st) return st; var ps=st.players||[]; for(var i=0;i<ps.length;i++){ if(ps[i].token===S.token){ ps[i].name=S.playerName||ps[i].name; return st; }} if(st.status!=='waiting') throw new Error('開始後は参加できません'); if(ps.length>=Number(st.maxPlayers||4)) throw new Error('満席です'); var seat=ps.length; ps.push({seat:seat,token:S.token,name:S.playerName||('プレイヤー'+(seat+1)),score:0,lockedRon:false}); st.players=ps; st.hands[String(seat)]=[]; st.openWords[String(seat)]=[]; st.discardBySeat[String(seat)]=[]; log(st,(S.playerName||('プレイヤー'+(seat+1)))+' が参加'); return st; }).then(function(r){ if(r.committed){S.roomId=roomId; localStorage.setItem(LS.room,roomId); subscribe(roomId); history.replaceState({},'',location.pathname+'?room='+roomId);} }).catch(function(e){toast('参加失敗: '+e.message);});}
function subscribe(roomId){ if(S.unsub) S.unsub(); var ref=roomRef(roomId); var cb=function(snap){ var v=snap.val(); if(!v) return; S.room=v; render(); }; ref.on('value',cb); S.unsub=function(){ref.off('value',cb);}; }
function startGame(){ mutate(function(st){ if(st.status!=='waiting') throw new Error('すでに開始済みです'); if((st.players||[]).length<2) throw new Error('2人以上必要です'); st.deck=makeDeck(); st.discards=[]; st.pendingDiscard=null; st.winner=null; st.logs=[]; var init=st.mode==='card'?7:13; st.hands={}; st.openWords={}; st.discardBySeat={}; st.players.forEach(function(p){ st.hands[String(p.seat)]=[]; st.openWords[String(p.seat)]=[]; st.discardBySeat[String(p.seat)]=[]; p.lockedRon=false; for(var i=0;i<init;i++) st.hands[String(p.seat)].push(st.deck.shift()); st.hands[String(p.seat)]=sortChars(st.hands[String(p.seat)]); }); st.status='playing'; st.turnSeat=0; st.phase='draw'; log(st,'ゲーム開始（'+(st.mode==='card'?'カード版':'牌版')+'）'); }); }
function resetRoom(){ if(!confirm('部屋を初期化しますか？')) return; mutate(function(st){ var players=(st.players||[]).map(function(p,i){return {seat:i,token:p.token,name:p.name,score:p.score||0,lockedRon:false};}); var mode=st.mode; var opts=st.options||{sevenPairs:false}; st.roomId=st.roomId; st.mode=mode; st.maxPlayers=st.maxPlayers; st.options=opts; st.status='waiting'; st.turnSeat=0; st.phase='draw'; st.pendingDiscard=null; st.players=players; st.hands={}; st.openWords={}; st.discardBySeat={}; players.forEach(function(p){st.hands[String(p.seat)]=[]; st.openWords[String(p.seat)]=[]; st.discardBySeat[String(p.seat)]=[];}); st.discards=[]; st.deck=[]; st.winner=null; st.logs=[]; log(st,'部屋を初期化'); }); }
function mutate(fn){ if(!S.roomId) return toast('先に部屋へ参加してください'); roomRef(S.roomId).transaction(function(st){ if(!st) return st; try{ fn(st); return st; } catch(e){ toast(e.message); return; } }); }

function drawOne(){ mutate(function(st){ ensureTurn(st,'draw'); if(!st.deck||!st.deck.length) throw new Error('山札がありません'); st.hands[String(mySeat())].push(st.deck.shift()); st.hands[String(mySeat())]=sortChars(st.hands[String(mySeat())]); st.phase='discard'; log(st,playerNameBySeat(st,mySeat())+' が山から1枚引いた'); }); }
function ensureTurn(st,needPhase){ if(st.status!=='playing') throw new Error('対局中ではありません'); var seat=findSeat(st,S.token); if(seat<0) throw new Error('参加者ではありません'); if(st.turnSeat!==seat) throw new Error('あなたの手番ではありません'); if(needPhase && st.phase!==needPhase) throw new Error('この操作は '+needPhase+' フェーズのみです'); }
function findSeat(st,token){ var ps=st.players||[]; for(var i=0;i<ps.length;i++) if(ps[i].token===token) return ps[i].seat; return -1; }
function playerNameBySeat(st,seat){ var ps=st.players||[]; for(var i=0;i<ps.length;i++) if(ps[i].seat===seat) return ps[i].name; return 'P'+(seat+1); }
function advanceAfterDiscard(st,discardSeat){ if(st.mode==='card'){ st.turnSeat=nextSeatLocal(st,discardSeat); st.phase='draw'; st.pendingDiscard=null; } else { st.turnSeat=nextSeatLocal(st,discardSeat); st.phase='claim'; st.pendingDiscard={seat:discardSeat,tile:st.discards[st.discards.length-1]}; } }
function nextSeatLocal(st,seat){ var n=(st.players||[]).length; return n?((seat+1)%n):0; }
function discardSelected(){ if(S.selected.length!==1) return toast('1枚選んでください'); var tileId=S.selected[0]; mutate(function(st){ ensureTurn(st,'discard'); var seat=findSeat(st,S.token); var h=st.hands[String(seat)]||[]; var idx=h.findIndex(function(t){return t.id===tileId;}); if(idx<0) throw new Error('手札にありません'); var tile=h.splice(idx,1)[0]; st.discards.push({seat:seat,ch:tile.ch,id:tile.id,at:nowIso()}); st.discardBySeat[String(seat)].push(tile.ch); st.hands[String(seat)]=sortChars(h); log(st,playerNameBySeat(st,seat)+' が「'+tile.ch+'」を捨てた'); advanceAfterDiscard(st,seat); }); S.selected=[]; }
function noClaimAdvance(){ mutate(function(st){ if(st.status!=='playing'||st.phase!=='claim') throw new Error('いまは流せません'); var seat=findSeat(st,S.token); if(seat!==st.turnSeat) throw new Error('次手番プレイヤーだけが進行できます'); st.pendingDiscard=null; st.phase='draw'; log(st,playerNameBySeat(st,seat)+' が捨て牌を流してツモへ進んだ'); }); }
function claimPon(){ if(S.selected.length!==2) return toast('ポン用に手札2枚を選んでください'); if(!(S.room&&S.room.pendingDiscard)) return toast('捨て牌がありません'); var word=prompt('3文字の単語を入力してください（ポン）'); if(!word) return; var chars=S.selected.map(getSelectedChar).filter(Boolean); chars.push(S.room.pendingDiscard.tile.ch); var wordChars=Array.from(word); if(wordChars.length!==3) return toast('3文字で入力してください'); if(!sameMultiset(chars,wordChars)) return toast('選択文字と単語の文字が一致しません'); var selIds=S.selected.slice(); mutate(function(st){ if(st.status!=='playing'||st.phase!=='claim'||!st.pendingDiscard) throw new Error('いまはポンできません'); var seat=findSeat(st,S.token); if(seat<0) throw new Error('参加者ではありません'); if(seat===st.pendingDiscard.seat) throw new Error('捨てた本人はポンできません'); var h=st.hands[String(seat)]||[]; var used=[]; selIds.forEach(function(id){ var idx=h.findIndex(function(t){return t.id===id;}); if(idx<0) throw new Error('選択牌がありません'); used.push(h.splice(idx,1)[0]); }); st.openWords[String(seat)].push({type:'pon',word:word,chars:wordChars,from:st.pendingDiscard.seat,at:nowIso()}); st.pendingDiscard=null; st.turnSeat=seat; st.phase='discard'; var p=(st.players||[]).find(function(x){return x.seat===seat;}); if(p) p.lockedRon=true; log(st,playerNameBySeat(st,seat)+' がポン「'+word+'」'); }); S.selected=[]; }
function claimKan(){ if(S.selected.length<4) return toast('カン用に4文字以上選んでください'); var chars=S.selected.map(getSelectedChar).filter(Boolean); var word=prompt('4文字以上の単語を入力してください（カン）'); if(!word) return; var wordChars=Array.from(word); if(wordChars.length<4) return toast('4文字以上で入力してください'); if(!sameMultiset(chars,wordChars)) return toast('選択文字と単語の文字が一致しません'); var selIds=S.selected.slice(); mutate(function(st){ ensureTurn(st,'discard'); if(st.mode!=='tile') throw new Error('カンは牌版のみです'); var seat=findSeat(st,S.token); var h=st.hands[String(seat)]||[]; selIds.forEach(function(id){ var idx=h.findIndex(function(t){return t.id===id;}); if(idx<0) throw new Error('選択牌がありません'); h.splice(idx,1); }); st.openWords[String(seat)].push({type:'kan',word:word,chars:wordChars,from:null,at:nowIso()}); var drawN=wordChars.length-3; for(var i=0;i<drawN;i++){ if(!st.deck.length) break; h.push(st.deck.shift()); } st.hands[String(seat)]=sortChars(h); var p=(st.players||[]).find(function(x){return x.seat===seat;}); if(p) p.lockedRon=true; log(st,playerNameBySeat(st,seat)+' がカン「'+word+'」を公開（補充 '+drawN+'）'); }); S.selected=[]; }
function claimRon(){ if(!(S.room&&S.room.pendingDiscard)) return toast('捨て牌がありません'); var st=S.room; var seat=mySeat(); var me=myPlayer(); if(!me) return; if(me.lockedRon) return toast('ポンまたはカン後はロンできません'); var dch=st.pendingDiscard.tile.ch; if(discardsOf(seat).includes(dch)) return toast('同じ文字を自分で捨てているためロンできません'); var words=prompt('ロン形の単語をスペース区切りで入力してください'); if(!words) return; var ws=parseWords(words); var open=openOf(seat); var chars=handOf(seat).map(function(t){return t.ch;}).concat([dch]); validateTileWin(ws,chars,open.length,(st.options||{}).sevenPairs,true); mutate(function(st2){ if(st2.phase!=='claim'||!st2.pendingDiscard) throw new Error('いまはロンできません'); var seat2=findSeat(st2,S.token); var me2=(st2.players||[]).find(function(p){return p.seat===seat2;}); if(me2&&me2.lockedRon) throw new Error('ポン/カン後はロンできません'); finishWinner(st2,seat2,'ロン',words,st2.pendingDiscard.seat); }); }
function claimTsumo(){ var st=S.room; var seat=mySeat(); var chars=handOf(seat).map(function(t){return t.ch;}); var words=prompt(st.mode==='card'?'あがりの3単語をスペース区切りで入力（3文字・3文字・2文字）':'あがりの単語をスペース区切りで入力'); if(!words) return; var ws=parseWords(words); if(st.mode==='card'){ validateCardWin(ws,chars); } else { validateTileWin(ws,chars,openOf(seat).length,(st.options||{}).sevenPairs,false); }
 mutate(function(st2){ ensureTurn(st2,'discard'); finishWinner(st2,findSeat(st2,S.token),st2.mode==='card'?'あがり':'ツモ',words,null); }); }
function finishWinner(st,seat,method,words,loserSeat){ st.status='ended'; st.phase='ended'; st.winner={seat:seat,method:method,words:words,at:nowIso()}; if(st.mode==='tile'){ (st.players||[]).forEach(function(p){ if(p.seat===seat) p.score=(p.score||0)+3; else if(method==='ツモ') p.score=(p.score||0)-1; else if(method==='ロン'&&p.seat===loserSeat) p.score=(p.score||0)-3; }); } st.resultSummary=playerNameBySeat(st,seat)+' が'+method+'！ 単語: '+words; log(st,st.resultSummary); }
function validateCardWin(ws,chars){ if(ws.length!==3) throw new Error('3単語を入力してください'); var ls=lens(ws); if(String(ls)!=='2,3,3') throw new Error('3文字・3文字・2文字で入力してください'); var all=[]; ws.forEach(function(w){ all=all.concat(Array.from(w)); }); if(all.length!==8) throw new Error('合計8文字にしてください'); if(!sameMultiset(all,chars)) throw new Error('手札8文字と単語の文字が一致しません'); }
function validateTileWin(ws,chars,openCount,allow7pairs,isRon){ if(openCount>0){ var all=[]; ws.forEach(function(w){ all=all.concat(Array.from(w)); }); if(!ws.length) throw new Error('残り手牌で作る単語を入力してください'); if(!sameMultiset(all,chars)) throw new Error('手牌の文字と入力単語が一致しません'); return; } var ls=lens(ws); var all=[]; ws.forEach(function(w){ all=all.concat(Array.from(w)); }); if(!sameMultiset(all,chars)) throw new Error('手牌の文字と入力単語が一致しません'); if(allow7pairs && ws.length===7 && ls.every(function(v){return v===2;})) return; if(String(ls)!=='2,3,3,3,3') throw new Error('標準形は3・3・3・3・2、または七対子(2×7)です'); }
function getSelectedChar(id){ var h=handOf(mySeat()); var t=h.find(function(x){return x.id===id;}); return t?t.ch:null; }
function toggleTile(id){ var idx=S.selected.indexOf(id); if(idx>=0) S.selected.splice(idx,1); else S.selected.push(id); render(); }

function render(){ renderMeta(); renderPlayers(); renderHand(); renderActions(); renderDiscards(); renderOpen(); renderLogs(); renderRules(); }
function renderMeta(){ var st=S.room; if(!st){ E.meta.innerHTML=''; E.message.textContent='部屋を作成するか参加してください。'; return; } var seat=mySeat(); var my=seat>=0?(S.room.players||[]).find(function(p){return p.seat===seat;}):null; var meta=[
  '部屋: '+st.roomId,
  '版: '+(st.mode==='card'?'カード版':'牌版'),
  '手番: '+playerNameBySeat(st,st.turnSeat),
  'フェーズ: '+phaseLabel(st),
  '山札: '+(st.deck?st.deck.length:0),
  '捨て: '+(st.discards?st.discards.length:0),
  'あなた: '+(my?my.name+' (P'+(seat+1)+')':'観戦')
 ]; E.meta.innerHTML=meta.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''); E.message.textContent=messageText(st); E.statusBadge.textContent=statusLabel(st.status); }
function phaseLabel(st){ return ({draw:'ツモ',discard:'整理/捨て',claim:'ポン/ロン確認',ended:'終了'})[st.phase]||st.phase; }
function statusLabel(s){ return ({waiting:'待機中',playing:'対局中',ended:'終了'})[s]||s; }
function messageText(st){ var seat=mySeat(); if(st.status==='waiting') return '参加者がそろったら開始してください。'; if(st.status==='ended') return st.resultSummary||'対局終了'; if(seat<0) return playerNameBySeat(st,st.turnSeat)+' の手番です。'; if(st.phase==='claim'){ if(st.pendingDiscard){ if(st.turnSeat===seat) return '誰もポン/ロンしないなら「流して次へ」でツモへ進めます。'; if(st.pendingDiscard.seat!==seat && st.mode==='tile') return '他家の捨て牌「'+st.pendingDiscard.tile.ch+'」にポン/ロンできます。'; } return '申告待ちです。'; } if(seat!==st.turnSeat) return playerNameBySeat(st,st.turnSeat)+' の手番です。'; if(st.phase==='draw') return '山から1枚取りましょう。'; if(st.phase==='discard') return '手札を確認して、あがり申告または1枚捨ててください。'; return '進行中です。'; }
function renderPlayers(){ var st=S.room; E.players.innerHTML=''; if(!st) return; var seat=mySeat(); (st.players||[]).forEach(function(p){ var hCount=(st.hands&&st.hands[String(p.seat)]||[]).length; var open=openOf(p.seat); var disc=discardsOf(p.seat); var div=document.createElement('div'); div.className='pl'+(st.turnSeat===p.seat?' act':''); var extra=''; if(st.mode==='card'){ var chars=(st.hands[String(p.seat)]||[]).map(function(t){return t.ch;}).join(' '); extra='<div class="sub">手札公開: '+esc(chars||'なし')+'</div>'; } div.innerHTML='<div class="nm">'+(p.seat===seat?'⭐ ':'')+esc(p.name)+'</div><div class="sub">手札 '+hCount+' / 公開語 '+open.length+' / 捨て '+disc.length+' / 得点 '+(p.score||0)+'</div>'+extra; E.players.appendChild(div); }); }
function renderHand(){ var st=S.room; E.hand.innerHTML=''; if(!st){E.handInfo.textContent='-'; return;} var seat=mySeat(); var h=seat<0?[]:handOf(seat); E.handInfo.textContent=seat<0?'観戦中':('手札 '+h.length+' 枚' + (st.mode==='tile'?'（他家には非公開）':'（全員公開）')); h.forEach(function(t){ var d=document.createElement('button'); d.className='tile small'+(S.selected.indexOf(t.id)>=0?' sel':''); d.innerHTML='<div class="k">'+esc(t.ch)+'</div><div class="m">'+esc((META[t.ch]||{}).kind||'')+'</div>'; d.onclick=function(){ toggleTile(t.id); }; E.hand.appendChild(d); }); }
function renderActions(){ var st=S.room; E.actions.innerHTML=''; if(!st) return; var seat=mySeat(); var can=seat===st.turnSeat && st.status==='playing'; var addBtn=function(cls,txt,fn,disabled){ var b=document.createElement('button'); b.className=cls; b.textContent=txt; b.disabled=!!disabled; b.onclick=fn; E.actions.appendChild(b); };
 addBtn('s','部屋IDコピー',function(){ navigator.clipboard.writeText(st.roomId).then(function(){toast('コピーしました');}); },!st.roomId);
 addBtn('g','開始',startGame, !(st.status==='waiting' && seat>=0 && (st.players||[]).length>=2));
 addBtn('r','初期化',resetRoom, seat<0);
 if(st.status!=='playing') return;
 if(can && st.phase==='draw') addBtn('p','山から1枚取る',drawOne,false);
 if(can && st.phase==='discard'){
   addBtn('v','あがり申告',claimTsumo,false);
   addBtn('s','1枚捨てる',discardSelected,S.selected.length!==1);
   if(st.mode==='tile') addBtn('v','カン申告',claimKan,S.selected.length<4);
 }
 if(st.mode==='tile' && st.phase==='claim' && st.pendingDiscard){
   if(seat>=0 && seat!==st.pendingDiscard.seat) {
     addBtn('v','ポン申告',claimPon,S.selected.length!==2);
     addBtn('r','ロン申告',claimRon,false);
   }
   if(seat===st.turnSeat) addBtn('g','流して次へ',noClaimAdvance,false);
 }
 var info=document.createElement('div'); info.className='rule'; info.innerHTML='選択中: '+(S.selected.map(getSelectedChar).join(' ')||'なし'); E.actions.appendChild(info);
 }
function renderDiscards(){ var st=S.room; E.discards.innerHTML=''; if(!st) return; var ds=st.discards||[]; ds.slice(-24).forEach(function(d){ var b=document.createElement('div'); b.className='dTile'; b.innerHTML='<div class="k">'+esc(d.ch)+'</div><div class="m">P'+(d.seat+1)+'</div>'; E.discards.appendChild(b); }); if(st.pendingDiscard&&st.pendingDiscard.tile) E.pendingBadge.textContent='確認中: 「'+st.pendingDiscard.tile.ch+'」'; else E.pendingBadge.textContent='なし'; }
function renderOpen(){ var st=S.room; E.openWords.innerHTML=''; if(!st) return; (st.players||[]).forEach(function(p){ var open=openOf(p.seat); if(!open.length) return; open.forEach(function(w){ var div=document.createElement('div'); div.className='openWord'; div.innerHTML='<span class="wl">'+esc(p.name)+' / '+esc(w.type.toUpperCase())+'</span>'+w.chars.map(function(ch){return '<span class="tile small"><span class="k">'+esc(ch)+'</span></span>';}).join('')+'<span class="badge">'+esc(w.word)+'</span>'; E.openWords.appendChild(div); }); }); if(!E.openWords.innerHTML) E.openWords.innerHTML='<div class="rule">まだ公開語はありません。</div>'; }
function renderLogs(){ var st=S.room; E.logs.innerHTML=''; if(!st) return; var logs=st.logs||[]; logs.slice().reverse().forEach(function(l){ var d=document.createElement('div'); d.className='log'; d.innerHTML='<div class="lt">'+esc(l.text)+'</div><div class="ls">'+esc(fmtTime(l.at))+'</div>'; E.logs.appendChild(d); }); }
function renderRules(){ var mode=E.modeSel.value; if(S.room) mode=S.room.mode; E.rulesText.innerHTML = mode==='card'
  ? 'カード版: 7枚配布 → ツモで8枚 → 3文字・3文字・2文字の3単語を作れたらあがり。<br>手札は全員公開です。辞書判定は自動ではなく、参加者の合意で進めてください。'
  : '牌版: 13枚配牌 → ツモで14枚 → 標準は3・3・3・3・2、七対子ONなら2文字×7も可。<br>ポン/カン/ロンは自己申告＋口頭確認で進めます。ポン/カン後はロン不可、ロンは自分が捨てた同文字では不可です。'; }
function fmtTime(t){ try{return new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch(e){return t||'';} }
function esc(s){ return String(s||'').replace(/[&<>"']/g,function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }

/* init */
E.playerName.value=S.playerName; if(S.roomId) E.roomInput.value=S.roomId; var q=new URL(location.href).searchParams.get('room'); if(q){ S.roomId=q.toUpperCase(); E.roomInput.value=S.roomId; localStorage.setItem(LS.room,S.roomId); }
E.playerName.addEventListener('change',saveName); E.modeSel.addEventListener('change',renderRules); E.createBtn.onclick=createRoom; E.joinBtn.onclick=joinRoom; E.copyBtn.onclick=function(){ var id=(S.room&&S.room.roomId)||E.roomInput.value||''; if(id) navigator.clipboard.writeText(id).then(function(){toast('コピーしました');}); }; E.startBtn.onclick=startGame; E.resetBtn.onclick=resetRoom; renderRules(); if(S.roomId) subscribe(S.roomId);
</script>
