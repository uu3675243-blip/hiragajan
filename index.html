<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ひらがじゃん オンライン</title>
  <!-- 開発・デモ用の Tailwind CDN。本番環境ではビルド済み CSS を使用してください -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card-tile {
      user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 font-sans pb-12">

  <div id="app" class="max-w-4xl mx-auto p-4">
    <!-- ヘッダー -->
    <header class="flex justify-between items-center bg-amber-800 text-amber-50 p-4 rounded-xl shadow-md mb-4">
      <h1 class="text-2xl font-bold tracking-wider">🃟 ひらがじゃん</h1>
      <div id="userInfo" class="text-sm bg-amber-900/50 px-3 py-1 rounded-full"></div>
    </header>

    <!-- 1. ロビー画面（名前入力 & 部屋作成・参加） -->
    <section id="screen-lobby" class="bg-white p-6 rounded-2xl shadow-sm border border-amber-200">
      <h2 class="text-xl font-bold mb-4 text-amber-900 border-b pb-2">ロビー</h2>
      <div class="space-y-4 max-w-md mx-auto">
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">プレイヤー名</label>
          <input type="text" id="input-playerName" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none" placeholder="名前を入力">
        </div>

        <div class="pt-2 border-t space-y-3">
          <button id="btn-createRoom" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl transition shadow">部屋を新しく作る</button>

          <div class="flex gap-2">
            <input type="text" id="input-roomId" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none uppercase tracking-widest font-mono text-center" placeholder="部屋番号 (8文字)">
            <button id="btn-joinRoom" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg transition shrink-0">参加</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 待機画面 -->
    <section id="screen-waiting" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-amber-200">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-xl font-bold text-amber-900">対戦待機室</h2>
        <div class="flex items-center gap-2">
          <span class="text-sm font-mono bg-amber-100 px-3 py-1 rounded text-amber-900 font-bold" id="display-roomId"></span>
          <button id="btn-copyLink" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded">URLコピー</button>
        </div>
      </div>

      <div class="mb-6">
        <h3 class="text-sm font-semibold text-slate-500 mb-2">参加者一覧</h3>
        <ul id="list-players" class="space-y-2"></ul>
      </div>

      <div id="host-controls" class="hidden border-t pt-4 flex gap-3">
        <button id="btn-startGame" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow transition">ゲームを開始する</button>
      </div>
    </section>

    <!-- 3. ゲーム対戦画面 -->
    <section id="screen-game" class="hidden space-y-4">
      <!-- 上部ステータス & 捨て場 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-amber-200">
        <div class="flex justify-between items-center mb-2">
          <div id="game-status" class="font-bold text-amber-900"></div>
          <div class="text-xs text-slate-500">山札残り: <span id="deck-count" class="font-bold text-slate-800"></span> 枚</div>
        </div>

        <div class="mb-2">
          <div class="text-xs font-semibold text-slate-500 mb-1">直前の捨て牌</div>
          <div id="discard-latest" class="h-12 flex items-center gap-2 p-1 bg-amber-50 rounded border border-amber-200 overflow-x-auto"></div>
        </div>
      </div>

      <!-- 完成枠（アガリ宣言用） -->
      <div class="bg-amber-100 p-4 rounded-xl border border-amber-300 shadow-inner">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-sm font-bold text-amber-900">完成枠（アガリ時にセット）</h3>
          <div class="flex gap-2">
            <button id="btn-mode-332" class="text-xs px-2 py-1 rounded bg-amber-700 text-white font-bold">3・3・2</button>
            <button id="btn-mode-8" class="text-xs px-2 py-1 rounded bg-amber-200 text-amber-800">8文字1単語型</button>
          </div>
        </div>

        <!-- 3・3・2 モード -->
        <div id="slot-container-332" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="bg-white p-2 rounded-lg border">
            <div class="text-xs text-slate-400 font-semibold mb-1">枠A (3文字)</div>
            <div id="slot-a" class="flex gap-1 min-h-[48px] items-center bg-slate-50 p-1 rounded"></div>
          </div>
          <div class="bg-white p-2 rounded-lg border">
            <div class="text-xs text-slate-400 font-semibold mb-1">枠B (3文字)</div>
            <div id="slot-b" class="flex gap-1 min-h-[48px] items-center bg-slate-50 p-1 rounded"></div>
          </div>
          <div class="bg-white p-2 rounded-lg border">
            <div class="text-xs text-slate-400 font-semibold mb-1">枠C (2文字)</div>
            <div id="slot-c" class="flex gap-1 min-h-[48px] items-center bg-slate-50 p-1 rounded"></div>
          </div>
        </div>

        <!-- 8文字 モード -->
        <div id="slot-container-8" class="hidden bg-white p-2 rounded-lg border">
          <div class="text-xs text-slate-400 font-semibold mb-1">8文字単語枠</div>
          <div id="slot-full8" class="flex gap-1 min-h-[48px] items-center bg-slate-50 p-1 rounded overflow-x-auto"></div>
        </div>

        <div class="mt-3 flex justify-end gap-2">
          <button id="btn-resetSlots" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded">枠をクリア</button>
          <button id="btn-submitAgari" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-5 py-1.5 rounded text-sm shadow transition">アガリ！</button>
        </div>
      </div>

      <!-- 自分手札エリア -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-amber-200">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-sm font-bold text-slate-700">自分の手札（タップで濁点切替 / 枠へセット）</h3>
          <span class="text-xs text-slate-400">カード数: <span id="hand-count">0</span></span>
        </div>
        <div id="hand-cards" class="flex flex-wrap gap-2 min-h-[64px] p-2 bg-amber-50/50 rounded-lg border border-dashed border-amber-300"></div>

        <div class="mt-3 border-t pt-3 flex justify-between items-center">
          <span class="text-xs text-slate-500">選択中カードの操作:</span>
          <button id="btn-discard" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-lg text-sm transition">選んだ1枚を捨てる</button>
        </div>
      </div>

      <!-- 他プレイヤーの状態 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-amber-200">
        <h3 class="text-xs font-semibold text-slate-500 mb-2">参加者状況</h3>
        <div id="other-players" class="flex flex-wrap gap-4 text-xs"></div>
      </div>
    </section>

    <!-- 4. アガリ（結果表示）モーダル -->
    <div id="modal-result" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl text-center space-y-4">
        <h2 class="text-2xl font-black text-rose-600">🎉 アガリ！</h2>
        <p id="result-winner" class="font-bold text-slate-800 text-lg"></p>

        <div id="result-words" class="bg-amber-50 p-4 rounded-xl border border-amber-200 text-left space-y-2"></div>

        <p class="text-xs text-slate-500">※参加者の皆さんで言葉として正しいか判定してください。</p>

        <div id="result-host-actions" class="hidden border-t pt-3">
          <button id="btn-resetRoom" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl transition">部屋を初期化して再戦</button>
        </div>
      </div>
    </div>

    <!-- ログ表示エリア -->
    <div class="mt-6 bg-slate-900 text-slate-300 p-3 rounded-xl text-xs font-mono max-h-32 overflow-y-auto">
      <div class="text-slate-500 mb-1 border-b border-slate-800 pb-1">システムログ</div>
      <div id="log-list" class="space-y-1"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, runTransaction, onValue, off } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyDTH8N9_9QAj_Id9KNnvVfN62v42zg-Rtk",
      authDomain: "hiragajan-af30f.firebaseapp.com",
      databaseURL: "https://hiragajan-af30f-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hiragajan-af30f",
      storageBucket: "hiragajan-af30f.firebasestorage.app",
      messagingSenderId: "209578576362",
      appId: "1:209578576362:web:1875a3f7ce9ff21c93ca93"
    };
    var ROOM_PATH = 'rooms_br';

    // 各種初期化
    const app = initializeApp(FIREBASE_CONFIG);
    const db = getDatabase(app);

    // ユーザー識別トークン
    let myToken = localStorage.getItem('hiragajan_user_token');
    if (!myToken) {
      myToken = crypto.randomUUID();
      localStorage.setItem('hiragajan_user_token', myToken);
    }
    document.getElementById('userInfo').innerText = `ID: ${myToken.substring(0, 6)}`;

    let currentRoomId = null;
    let roomRef = null;
    let localRoomState = null;
    let selectedHandCardId = null;
    let slotMode = '332'; // '332' or '8'
    let slots = { slotA: [], slotB: [], slotC: [], slotFull8: [] };
    let unsubRoom = null;

    // 文字切り替えマップ
    const CHAR_MAP = {
      'か': ['か', 'が'], 'き': ['き', 'ぎ'], 'く': ['く', 'ぐ'], 'け': ['け', 'げ'], 'こ': ['こ', 'ご'],
      'さ': ['さ', 'ざ'], 'し': ['し', 'じ'], 'す': ['す', 'ず'], 'せ': ['せ', 'ぜ'], 'そ': ['そ', 'ぞ'],
      'た': ['た', 'だ'], 'ち': ['ち', 'ぢ'], 'つ': ['つ', 'づ'], 'て': ['て', 'で'], 'と': ['と', 'ど'],
      'は': ['は', 'ば', 'ぱ'], 'ひ': ['ひ', 'び', 'ぴ'], 'ふ': ['ふ', 'ぶ', 'ぷ'], 'へ': ['へ', 'べ', 'ぺ'], 'ほ': ['ほ', 'ぼ', 'ぽ'],
      'う': ['う', 'ゔ']
    };

    // 清音46文字
    const SEION_LIST = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん".split('');

    // デッキ生成（清音46文字 × 各2枚 = 92枚）
    function generateDeck() {
      const deck = [];
      let idCounter = 1;
      for (let i = 0; i < 2; i++) {
        for (const char of SEION_LIST) {
          deck.push({ id: `c_${idCounter++}`, char: char, origChar: char });
        }
      }
      // シャッフル
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    // 8文字ルームID生成
    function generateRoomId() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      let res = '';
      for (let i = 0; i < 8; i++) {
        res += chars[bytes[i] % chars.length];
      }
      return res;
    }

    // DOM要素
    const screenLobby = document.getElementById('screen-lobby');
    const screenWaiting = document.getElementById('screen-waiting');
    const screenGame = document.getElementById('screen-game');
    const modalResult = document.getElementById('modal-result');

    // URLハッシュから自動参加チェック
    window.addEventListener('load', () => {
      const hash = location.hash.replace('#', '').trim();
      if (hash.length === 8) {
        document.getElementById('input-roomId').value = hash;
      }
    });

    // ログ書き込み用ヘルパー（transaction 内では serverTimestamp を使わず Date.now() を使用）
    function addLogToData(data, text) {
      if (!data.logs) data.logs = [];
      data.logs.push({ message: text, timestamp: Date.now() });
      if (data.logs.length > 100) data.logs.shift();
    }

    // トランザクションエラーハンドリング付きラッパー
    function safeTransaction(refPath, updateFn) {
      return runTransaction(refPath, updateFn).catch((err) => {
        console.error("Transaction error:", err);
        if (err.code === 'PERMISSION_DENIED' || (err.message && err.message.includes('permission_denied'))) {
          alert("データベースの書き込みが拒否されました。Firebase コンソール > Realtime Database > ルール を確認してください。");
        } else {
          alert("エラーが発生しました: " + (err.message || err.code));
        }
        throw err;
      });
    }

    // 1. 部屋作成
    document.getElementById('btn-createRoom').addEventListener('click', () => {
      const name = document.getElementById('input-playerName').value.trim();
      if (!name) return alert('名前を入力してください');

      const roomId = generateRoomId();
      const targetRef = ref(db, `${ROOM_PATH}/${roomId}`);

      safeTransaction(targetRef, (current) => {
        if (current !== null) return; // 既に存在する場合は競合abort

        return {
          createdAt: Date.now(),
          status: 'waiting',
          hostToken: myToken,
          turnPlayerToken: '',
          turnOrder: [],
          deck: [],
          discardPile: [],
          winner: null,
          players: {
            [myToken]: { name: name, joinedAt: Date.now(), hand: [] }
          },
          logs: [{ message: `${name} さんが部屋を作成しました`, timestamp: Date.now() }]
        };
      }).then((res) => {
        if (res.committed) {
          joinRoomSuccess(roomId);
        } else {
          alert('部屋作成に失敗しました。再試行してください。');
        }
      });
    });

    // 2. 部屋参加
    document.getElementById('btn-joinRoom').addEventListener('click', () => {
      const name = document.getElementById('input-playerName').value.trim();
      const roomId = document.getElementById('input-roomId').value.trim().toUpperCase();
      if (!name) return alert('名前を入力してください');
      if (!roomId) return alert('部屋番号を入力してください');

      const targetRef = ref(db, `${ROOM_PATH}/${roomId}`);

      safeTransaction(targetRef, (current) => {
        if (current === null) return; // 部屋が存在しない場合はabort
        if (!current.players) current.players = {};

        current.players[myToken] = {
          name: name,
          joinedAt: Date.now(),
          hand: current.players[myToken]?.hand || []
        };

        addLogToData(current, `${name} さんが参加しました`);
        return current;
      }).then((res) => {
        if (res.committed && res.snapshot.exists()) {
          joinRoomSuccess(roomId);
        } else {
          alert('部屋が存在しないか、参加に失敗しました。');
        }
      });
    });

    function joinRoomSuccess(roomId) {
      currentRoomId = roomId;
      location.hash = roomId;
      if (unsubRoom) off(roomRef, 'value', unsubRoom);
      roomRef = ref(db, `${ROOM_PATH}/${currentRoomId}`);
      unsubRoom = onValue(roomRef, (snapshot) => {
        if (!snapshot.exists()) {
          alert('部屋が削除されました');
          location.reload();
          return;
        }
        localRoomState = snapshot.val();
        renderUI();
      });
    }

    // ページ離脱時にリスナーを解除
    window.addEventListener('beforeunload', () => {
      if (roomRef && unsubRoom) off(roomRef, 'value', unsubRoom);
    });

    // URLコピー
    document.getElementById('btn-copyLink').addEventListener('click', () => {
      navigator.clipboard.writeText(location.href).then(() => alert('URLをコピーしました'));
    });

    // 3. ゲーム開始 (Transaction)
    document.getElementById('btn-startGame').addEventListener('click', () => {
      if (!roomRef) return;
      safeTransaction(roomRef, (current) => {
        if (!current || current.hostToken !== myToken) return;

        const playerTokens = Object.keys(current.players || {});
        if (playerTokens.length < 1) return;

        const deck = generateDeck();
        current.turnOrder = playerTokens;
        current.turnPlayerToken = playerTokens[0];
        current.status = 'playing';
        current.discardPile = [];
        current.winner = null;

        // 各プレイヤーに7枚配る
        for (const token of playerTokens) {
          current.players[token].hand = deck.splice(0, 7);
        }

        // 最初のプレイヤーが1枚引いて8枚にする
        if (deck.length > 0) {
          current.players[current.turnPlayerToken].hand.push(deck.shift());
        }

        current.deck = deck;
        addLogToData(current, 'ゲームを開始ました！');
        return current;
      });
    });

    // UIの描画更新
    function renderUI() {
      if (!localRoomState) return;

      const state = localRoomState;
      const isHost = state.hostToken === myToken;

      // 画面切り替え
      if (state.status === 'waiting') {
        screenLobby.classList.add('hidden');
        screenWaiting.classList.remove('hidden');
        screenGame.classList.add('hidden');
        modalResult.classList.add('hidden');

        document.getElementById('display-roomId').innerText = currentRoomId;
        document.getElementById('host-controls').classList.toggle('hidden', !isHost);

        // 参加者リスト
        const list = document.getElementById('list-players');
        list.innerHTML = '';
        Object.entries(state.players || {}).forEach(([token, p]) => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center p-2 bg-amber-50 rounded border border-amber-200 text-sm';
          li.innerHTML = `<span class="font-bold">${escapeHtml(p.name)} ${token === state.hostToken ? '👑(ホスト)' : ''}</span>`;
          list.appendChild(li);
        });

      } else if (state.status === 'playing' || state.status === 'finished') {
        screenLobby.classList.add('hidden');
        screenWaiting.classList.add('hidden');
        screenGame.classList.remove('hidden');

        // アガリモーダル
        if (state.status === 'finished' && state.winner) {
          modalResult.classList.remove('hidden');
          document.getElementById('result-winner').innerText = `${state.winner.name} さんのアガリ！`;

          const wordsDiv = document.getElementById('result-words');
          wordsDiv.innerHTML = '';
          if (state.winner.words.mode === '332') {
            wordsDiv.innerHTML = `
              <div><span class="text-xs text-slate-400">枠A:</span> <strong class="text-amber-900">${escapeHtml(state.winner.words.slotA)}</strong></div>
              <div><span class="text-xs text-slate-400">枠B:</span> <strong class="text-amber-900">${escapeHtml(state.winner.words.slotB)}</strong></div>
              <div><span class="text-xs text-slate-400">枠C:</span> <strong class="text-amber-900">${escapeHtml(state.winner.words.slotC)}</strong></div>
            `;
          } else {
            wordsDiv.innerHTML = `<div><span class="text-xs text-slate-400">8文字:</span> <strong class="text-amber-900">${escapeHtml(state.winner.words.full8)}</strong></div>`;
          }
          document.getElementById('result-host-actions').classList.toggle('hidden', !isHost);
        } else {
          modalResult.classList.add('hidden');
        }

        // ステータス表示
        const isMyTurn = state.turnPlayerToken === myToken;
        const currentTurnPlayer = state.players[state.turnPlayerToken]?.name || '不明';
        document.getElementById('game-status').innerText = isMyTurn ? '👉 あなたのターンです！' : `${currentTurnPlayer} さんのターンです`;
        document.getElementById('deck-count').innerText = state.deck ? state.deck.length : 0;

        // 直前の捨て牌
        const discardDiv = document.getElementById('discard-latest');
        discardDiv.innerHTML = '';
        (state.discardPile || []).slice(-10).reverse().forEach(card => {
          const tile = document.createElement('div');
          tile.className = 'w-8 h-10 bg-white border border-amber-400 rounded flex items-center justify-center font-bold text-amber-900 shadow-sm shrink-0';
          tile.innerText = card.char;
          discardDiv.appendChild(tile);
        });

        // 自分の手札描画
        const myHand = state.players[myToken]?.hand || [];
        document.getElementById('hand-count').innerText = myHand.length;
        const handDiv = document.getElementById('hand-cards');
        handDiv.innerHTML = '';

        myHand.forEach(card => {
          // すでに枠にセットされていないかチェック
          const isUsed = Object.values(slots).flat().some(c => c.id === card.id);
          if (isUsed) return;

          const tile = document.createElement('button');
          const isSelected = selectedHandCardId === card.id;
          tile.className = `card-tile w-12 h-16 rounded-xl border-2 font-black text-xl shadow flex flex-col items-center justify-center transition ${isSelected ? 'border-amber-600 bg-amber-200 -translate-y-1' : 'border-amber-300 bg-white hover:bg-amber-50'}`;
          tile.innerHTML = `<span>${card.char}</span>`;

          tile.addEventListener('click', () => {
            if (selectedHandCardId === card.id) {
              // 2回連続クリックで濁点切替
              toggleChar(card.id);
            } else {
              selectedHandCardId = card.id;
              renderUI();
            }
          });

          handDiv.appendChild(tile);
        });

        // 他プレイヤー状況
        const othersDiv = document.getElementById('other-players');
        othersDiv.innerHTML = '';
        Object.entries(state.players || {}).forEach(([token, p]) => {
          if (token === myToken) return;
          const isTurn = state.turnPlayerToken === token;
          const div = document.createElement('div');
          div.className = `p-2 rounded border ${isTurn ? 'bg-amber-100 border-amber-400 font-bold' : 'bg-slate-50'}`;
          div.innerText = `${p.name}: 手札 ${p.hand?.length || 0}枚 ${isTurn ? '🎲' : ''}`;
          othersDiv.appendChild(div);
        });

        renderSlots();
      }

      // ログ描画
      const logList = document.getElementById('log-list');
      logList.innerHTML = '';
      (state.logs || []).slice().reverse().forEach(log => {
        const div = document.createElement('div');
        div.innerText = log.message;
        logList.appendChild(div);
      });
    }

    // 手札文字の濁点・半濁点トグル切り替え
    function toggleChar(cardId) {
      if (!roomRef) return;
      safeTransaction(roomRef, (current) => {
        if (!current) return;
        const hand = current.players[myToken]?.hand || [];
        const card = hand.find(c => c.id === cardId);
        if (!card) return;

        const candidates = CHAR_MAP[card.origChar];
        if (candidates && candidates.length > 1) {
          const nextIdx = (candidates.indexOf(card.char) + 1) % candidates.length;
          card.char = candidates[nextIdx];
        }
        return current;
      });
    }

    // 完成枠のモード切り替え
    document.getElementById('btn-mode-332').addEventListener('click', () => {
      slotMode = '332';
      document.getElementById('slot-container-332').classList.remove('hidden');
      document.getElementById('slot-container-8').classList.add('hidden');
      document.getElementById('btn-mode-332').className = 'text-xs px-2 py-1 rounded bg-amber-700 text-white font-bold';
      document.getElementById('btn-mode-8').className = 'text-xs px-2 py-1 rounded bg-amber-200 text-amber-800';
      clearSlots();
    });

    document.getElementById('btn-mode-8').addEventListener('click', () => {
      slotMode = '8';
      document.getElementById('slot-container-332').classList.add('hidden');
      document.getElementById('slot-container-8').classList.remove('hidden');
      document.getElementById('btn-mode-8').className = 'text-xs px-2 py-1 rounded bg-amber-700 text-white font-bold';
      document.getElementById('btn-mode-332').className = 'text-xs px-2 py-1 rounded bg-amber-200 text-amber-800';
      clearSlots();
    });

    // 枠へのカードセット処理
    function assignCardToSlot(slotKey, maxCount) {
      if (!selectedHandCardId) return;
      const myHand = localRoomState?.players[myToken]?.hand || [];
      const card = myHand.find(c => c.id === selectedHandCardId);
      if (!card) return;

      if (slots[slotKey].length >= maxCount) return alert(`この枠は最大${maxCount}文字までです`);

      slots[slotKey].push(card);
      selectedHandCardId = null;
      renderUI();
    }

    document.getElementById('slot-a').addEventListener('click', () => assignCardToSlot('slotA', 3));
    document.getElementById('slot-b').addEventListener('click', () => assignCardToSlot('slotB', 3));
    document.getElementById('slot-c').addEventListener('click', () => assignCardToSlot('slotC', 2));
    document.getElementById('slot-full8').addEventListener('click', () => assignCardToSlot('slotFull8', 8));

    function clearSlots() {
      slots = { slotA: [], slotB: [], slotC: [], slotFull8: [] };
      renderUI();
    }
    document.getElementById('btn-resetSlots').addEventListener('click', clearSlots);

    function renderSlots() {
      const renderContainer = (containerId, cardList) => {
        const el = document.getElementById(containerId);
        el.innerHTML = '';
        cardList.forEach((card, idx) => {
          const tile = document.createElement('button');
          tile.className = 'w-10 h-12 bg-amber-100 border border-amber-400 rounded font-bold text-amber-900 shadow-sm flex items-center justify-center';
          tile.innerText = card.char;
          tile.addEventListener('click', (e) => {
            e.stopPropagation();
            cardList.splice(idx, 1);
            renderUI();
          });
          el.appendChild(tile);
        });
      };

      renderContainer('slot-a', slots.slotA);
      renderContainer('slot-b', slots.slotB);
      renderContainer('slot-c', slots.slotC);
      renderContainer('slot-full8', slots.slotFull8);
    }

    // 4. 1枚捨てる (Transaction)
    document.getElementById('btn-discard').addEventListener('click', () => {
      if (!roomRef || !localRoomState) return;
      if (localRoomState.turnPlayerToken !== myToken) return alert('あなたのターンではありません');
      if (!selectedHandCardId) return alert('捨てるカードを選択してください');

      safeTransaction(roomRef, (current) => {
        if (!current || current.turnPlayerToken !== myToken) return;

        const hand = current.players[myToken]?.hand || [];
        const cardIdx = hand.findIndex(c => c.id === selectedHandCardId);
        if (cardIdx === -1) return;

        const [discardedCard] = hand.splice(cardIdx, 1);
        if (!current.discardPile) current.discardPile = [];
        current.discardPile.push(discardedCard);

        // ターン移行
        const order = current.turnOrder || [];
        const nextIdx = (order.indexOf(myToken) + 1) % order.length;
        const nextToken = order[nextIdx];
        current.turnPlayerToken = nextToken;

        // 次のプレイヤーが山札から1枚引く
        if (current.deck && current.deck.length > 0) {
          current.players[nextToken].hand.push(current.deck.shift());
        }

        const myName = current.players[myToken].name;
        addLogToData(current, `${myName} さんが 「${discardedCard.char}」 を捨てました`);

        return current;
      }).then(() => {
        selectedHandCardId = null;
        clearSlots();
      });
    });

    // 5. アガリ！宣言 (Transaction)
    document.getElementById('btn-submitAgari').addEventListener('click', () => {
      if (!roomRef || !localRoomState) return;
      if (localRoomState.turnPlayerToken !== myToken) return alert('あなたのターンではありません');

      let wordData = { mode: slotMode };
      if (slotMode === '332') {
        if (slots.slotA.length !== 3 || slots.slotB.length !== 3 || slots.slotC.length !== 2) {
          return alert('枠A(3文字)、枠B(3文字)、枠C(2文字)をすべて埋めてください');
        }
        wordData.slotA = slots.slotA.map(c => c.char).join('');
        wordData.slotB = slots.slotB.map(c => c.char).join('');
        wordData.slotC = slots.slotC.map(c => c.char).join('');
      } else {
        if (slots.slotFull8.length !== 8) {
          return alert('8文字単語枠を埋めてください');
        }
        wordData.full8 = slots.slotFull8.map(c => c.char).join('');
      }

      safeTransaction(roomRef, (current) => {
        if (!current || current.turnPlayerToken !== myToken) return;

        current.status = 'finished';
        current.winner = {
          token: myToken,
          name: current.players[myToken].name,
          words: wordData
        };

        const myName = current.players[myToken].name;
        addLogToData(current, `🎉 ${myName} さんが「アガリ！」を宣言しました！`);

        return current;
      });
    });

    // 6. ルーム初期化 (Transaction)
    document.getElementById('btn-resetRoom').addEventListener('click', () => {
      if (!roomRef) return;
      safeTransaction(roomRef, (current) => {
        if (!current || current.hostToken !== myToken) return;

        current.status = 'waiting';
        current.turnPlayerToken = '';
        current.deck = [];
        current.discardPile = [];
        current.winner = null;

        Object.keys(current.players || {}).forEach(token => {
          current.players[token].hand = [];
        });

        addLogToData(current, 'ルームが初期化されました');
        return current;
      }).then(() => {
        clearSlots();
      });
    });

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
